name: Build Renderer Benchmarks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v7

      - name: Checkout Renderer source
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.Renderer
          path: Renderer

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.Renderer.Benchmarks.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.Renderer.Benchmarks.slnx --configuration Release --no-restore
